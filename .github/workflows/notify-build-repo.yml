name: Notify Build Repo

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger build repo update
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.BUILD_REPO_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/floppyshy-byte/Acestep-runpod-build/dispatches \
            -d '{"event_type":"ace-step-updated","client_payload":{"commit":"'"${{ github.sha }}"'"}}'
